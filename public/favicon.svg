<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#421d24"/>
      <stop offset="50%" stop-color="#261217"/>
      <stop offset="100%" stop-color="#14090b"/>
    </linearGradient>
    <linearGradient id="lilacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4c7ff"/>
      <stop offset="100%" stop-color="#714cb6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Icon / Squircle shape -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#d4c7ff" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Subtle orbital ring -->
  <ellipse cx="256" cy="256" rx="190" ry="85" fill="none" stroke="#714cb6" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.4" transform="rotate(-28 256 256)"/>
  <circle cx="395" cy="180" r="7" fill="#d4c7ff" filter="url(#glow)"/>

  <!-- Minimalist Book / Open Pages silhouette -->
  <path d="M140 370 C 200 355, 240 365, 256 376 C 272 365, 312 355, 372 370 L 372 350 C 312 335, 272 345, 256 356 C 240 345, 200 335, 140 350 Z" fill="#d4c7ff" opacity="0.6"/>

  <!-- 10x Typography -->
  <g filter="url(#glow)">
    <text x="256" y="278" 
          text-anchor="middle" 
          font-family="'Inter', system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="160" 
          letter-spacing="-9" 
          fill="#ffffff">
      10<tspan fill="url(#lilacGrad)" dx="-4">×</tspan>
    </text>
  </g>

  <!-- Tomorrow / AI Sub-label -->
  <text x="256" y="325" 
        text-anchor="middle" 
        font-family="'Inter', system-ui, sans-serif" 
        font-weight="700" 
        font-size="28" 
        letter-spacing="9" 
        fill="#d4c7ff">
    TOMORROW
  </text>
</svg>
